[build]
  publish = "public"
  command = "npm run build"

# ── Security & performance headers ──────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Redirects ────────────────────────────────────────────────────────────────

# auth.js is a v1 function — needs an explicit redirect
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

# Admin dashboard
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Admin login (disguised)
[[redirects]]
  from = "/tomancond"
  to = "/tomancond/index.html"
  status = 200

# Booking sub-paths
[[redirects]]
  from = "/booking"
  to = "/booking.html"
  status = 200

# Confirmed sub-paths
[[redirects]]
  from = "/confirmed"
  to = "/confirmed.html"
  status = 200

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
