[build]
  publish = "public"
  command = "npm install && ./node_modules/.bin/tailwindcss -i ./src/input.css -o ./public/output.css --minify"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/booking/*"
  to = "/booking.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
